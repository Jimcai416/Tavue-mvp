name: Cloud photo calibration
run-name: Photo calibration 40 images · ${{ github.run_id }}
on:
  push:
    branches: ['feat/cloud-photo-review-resume']
    paths: ['catalog/cloud-review-request.json']
permissions:
  contents: read
concurrency:
  group: cloud-photo-calibration
  cancel-in-progress: false
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - name: Verify credential and model availability
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/photos/cloud_batch.py validate
      - name: Refuse duplicate paid submission on rerun
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo 'Recover the saved receipt/lock artifacts; reruns must not submit paid batches again.'
            exit 1
          fi
      - name: Prepare fixed 40-photo calibration
        run: python -u scripts/photos/cloud_batch.py prepare
      - name: Preserve immutable prepared requests
        uses: actions/upload-artifact@v4
        with:
          name: calibration-prepared-${{ github.run_id }}
          path: catalog/work/cloud-calibration/
          retention-days: 30
          if-no-files-found: error
      - name: Submit once with 40-request cap
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -u scripts/photos/cloud_batch.py submit
      - name: Preserve receipt or ambiguous-submission lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-receipt-${{ github.run_id }}
          path: |
            catalog/work/cloud-calibration/*.job.json
            catalog/work/cloud-calibration/*.submit-lock.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Collect without resubmitting
        if: success()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -u scripts/photos/cloud_batch.py poll --seconds 14400
      - name: Preserve results and checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-checkpoint-${{ github.run_id }}
          path: catalog/work/cloud-calibration/
          retention-days: 90
          if-no-files-found: ignore
