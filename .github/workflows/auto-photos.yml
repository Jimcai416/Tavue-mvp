name: Claude continuous photo discovery and intake
run-name: Claude finds and reviews new dish photos · ${{ github.run_id }}
on:
  push:
    branches: ['feat/photo-review-20261117']
    paths: ['catalog/auto-photo-request.json']
permissions:
  contents: write
concurrency:
  group: tavue-claude-photo-intake
  cancel-in-progress: false
jobs:
  collect-review-integrate:
    uses: ./.github/workflows/auto-photo-stage.yml
    with:
      stage: 1
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  continue-review-2:
    needs: collect-review-integrate
    if: needs.collect-review-integrate.outputs.needsContinue == 'true'
    uses: ./.github/workflows/auto-photo-stage.yml
    with:
      stage: 2
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  continue-review-3:
    needs: continue-review-2
    if: needs.continue-review-2.outputs.needsContinue == 'true'
    uses: ./.github/workflows/auto-photo-stage.yml
    with:
      stage: 3
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  verify-queue-complete:
    needs: [collect-review-integrate, continue-review-2, continue-review-3]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require successful review and verification stages
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Require every candidate to have a saved decision
        run: python scripts/photos/auto_photo_progress.py --require-complete
