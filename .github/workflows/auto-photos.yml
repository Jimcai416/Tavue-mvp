name: Claude continuous photo discovery and intake
run-name: Claude Europe-first photo intake toward 10,000, cumulative $600 cap · ${{ github.run_id }}
on:
  push:
    branches: ['feat/photo-review-20261117']
    paths: ['catalog/auto-photo-request.json']
permissions:
  contents: write
concurrency:
  group: tavue-claude-photo-intake
  cancel-in-progress: false
jobs:
  collect-review-integrate:
    uses: ./.github/workflows/auto-photo-stage.yml
    with:
      stage: 1
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  continue-review-2:
    needs: collect-review-integrate
    if: needs.collect-review-integrate.outputs.needsContinue == 'true'
    uses: ./.github/workflows/auto-photo-stage.yml
    with:
      stage: 2
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  continue-review-3:
    needs: continue-review-2
    if: needs.continue-review-2.outputs.needsContinue == 'true'
    uses: ./.github/workflows/auto-photo-stage.yml
    with:
      stage: 3
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  continue-review-4:
    needs: continue-review-3
    if: needs.continue-review-3.outputs.needsContinue == 'true'
    uses: ./.github/workflows/auto-photo-stage.yml
    with:
      stage: 4
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  continue-review-5:
    needs: continue-review-4
    if: needs.continue-review-4.outputs.needsContinue == 'true'
    uses: ./.github/workflows/auto-photo-stage.yml
    with:
      stage: 5
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  continue-review-6:
    needs: continue-review-5
    if: needs.continue-review-5.outputs.needsContinue == 'true'
    uses: ./.github/workflows/auto-photo-stage.yml
    with:
      stage: 6
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  continue-review-7:
    needs: continue-review-6
    if: needs.continue-review-6.outputs.needsContinue == 'true'
    uses: ./.github/workflows/auto-photo-stage.yml
    with:
      stage: 7
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  continue-review-8:
    needs: continue-review-7
    if: needs.continue-review-7.outputs.needsContinue == 'true'
    uses: ./.github/workflows/auto-photo-stage.yml
    with:
      stage: 8
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  verify-target-complete:
    name: Verify 10,000 photos or report budget/error decision
    needs: [collect-review-integrate, continue-review-2, continue-review-3, continue-review-4, continue-review-5, continue-review-6, continue-review-7, continue-review-8]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report actual target and cumulative budget state
        if: always()
        run: python scripts/photos/auto_photo_progress.py --require-complete
      - name: Require successful review and app verification stages
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
